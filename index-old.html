<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сайт учителя — Тамара Салмановна</title>
<style>
:root{--wine:#6b2634;--wine2:#8b3b4b;--cream:#f8f3ed;--card:#fff;--line:#dccfc1;--text:#332d2b;--muted:#746963}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--text)}
header{background:var(--wine);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0002}
.top{max-width:1150px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:21px;font-weight:700}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:9px 11px;border-radius:9px}.nav a:hover{background:#fff2}
.menu{display:none;background:#fff;color:var(--wine);border:0;border-radius:9px;padding:9px 12px;font-size:18px}
main{max-width:1150px;margin:auto;padding:25px 16px 50px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center}
.photo{width:220px;height:260px;object-fit:cover;border-radius:18px;border:1px solid var(--line);background:#eee}.hero h1{font-size:36px;margin:0 0 10px;color:var(--wine)}.hero p{font-size:18px;line-height:1.55}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:20px}h2{color:var(--wine);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:15px;padding:17px;background:#fff}.card h3{margin:0 0 8px;color:var(--wine)}.card p{margin:5px 0;line-height:1.45}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#f2e7dd;color:var(--wine)}
.btn{border:0;border-radius:12px;padding:11px 17px;font-size:16px;cursor:pointer}.btn-wine{background:var(--wine);color:#fff}.btn-light{background:#fff;color:var(--wine)}.btn-outline{background:#fff;border:1px solid var(--wine);color:var(--wine)}
footer{background:var(--wine);color:#fff;padding:28px 18px;text-align:center}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.hidden{display:none!important}.box{background:#fff;border-radius:20px;width:min(850px,100%);max-height:94vh;overflow:auto;padding:24px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 13px}textarea{min-height:90px;resize:vertical}label{font-weight:700;color:var(--wine)}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.editor-section{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.small{font-size:13px;color:var(--muted)}.status{font-weight:700;margin:10px 0}
@media(max-width:760px){.nav{display:none}.nav.open{display:flex;position:absolute;left:10px;right:10px;top:62px;background:var(--wine);padding:10px;flex-direction:column}.menu{display:block}.hero{grid-template-columns:1fr;padding:20px}.photo{width:180px;height:215px}.hero h1{font-size:29px}.grid{grid-template-columns:1fr}main{padding:16px 10px}}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">Тамара Салмановна</div>
<button class="menu" onclick="toggleMenu()">☰</button>
<nav id="nav" class="nav">
<a href="#about">О преподавателе</a><a href="#schedule">Расписание</a><a href="#materials">Материалы</a><a href="#news">Новости</a><a href="#contacts">Контакты</a>
<button class="btn btn-light" onclick="openLogin()">Войти</button>
</nav>
</div>
</header>

<main>
<div class="hero">
<div id="mainPhoto"></div>
<div><h1 id="mainName"></h1><p id="mainSubject"></p><p id="mainBio"></p></div>
</div>

<section id="about"><h2>О преподавателе</h2><p id="aboutText"></p></section>

<section id="schedule">
<h2>Расписание</h2>
<div class="table-wrap"><table><thead><tr><th>День</th><th>Время</th><th>Предмет</th><th>Класс</th><th>Кабинет</th></tr></thead>
<tbody id="scheduleBody"></tbody></table></div>
</section>

<section id="materials"><h2>Учебные материалы</h2><div id="materialsGrid" class="grid"></div></section>

<section id="news"><h2>Новости и объявления</h2><div id="newsGrid" class="grid"></div></section>

<section id="contacts"><h2>Контакты</h2><p id="contactsText"></p></section>
</main>

<footer>© <span id="year"></span> Тамара Салмановна</footer>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden"><div class="box">
<h2>Вход в панель учителя</h2>
<label>Логин</label><input id="login" autocomplete="username">
<label>Пароль</label><input id="password" type="password" autocomplete="current-password">
<div id="loginError" class="status"></div>
<div class="row"><button class="btn btn-outline" onclick="closeLogin()">Отмена</button><button class="btn btn-wine" onclick="login()">Войти</button></div>
</div></div>

<!-- ADMIN -->
<div id="adminModal" class="modal hidden"><div class="box">
<h2>Панель учителя</h2>
<div class="editor-section">
<h3>Основная информация</h3>
<label>Имя</label><input id="editName">
<label>Краткое описание</label><textarea id="editSubject"></textarea>
<label>Информация о преподавателе</label><textarea id="editBio"></textarea>
<label>О преподавателе</label><textarea id="editAbout"></textarea>
<label>Контакты</label><textarea id="editContacts"></textarea>
<label>Фото</label><input id="photoFile" type="file" accept="image/*" onchange="previewPhoto(event)">
<div id="photoPreview"></div>
</div>

<div class="editor-section"><h3>Расписание</h3><div id="scheduleEditor"></div>
<button class="btn btn-outline" onclick="addSchedule()">+ Добавить строку</button></div>

<div class="editor-section"><h3>Материалы</h3><div id="materialsEditor"></div>
<button class="btn btn-outline" onclick="addMaterial()">+ Добавить материал</button></div>

<div class="editor-section"><h3>Новости</h3><div id="newsEditor"></div>
<button class="btn btn-outline" onclick="addNews()">+ Добавить новость</button></div>

<div id="saveStatus" class="status"></div>
<div class="row"><button class="btn btn-outline" onclick="closeAdmin()">Выйти</button><button class="btn btn-wine" onclick="saveProfile()">Сохранить всё</button></div>
</div></div>

<script>
const CREDENTIALS={login:"Tamara062",password:"Tamara1962"};
const KEY="tamaraTeacherSiteV2";

function defaults(){
 return {
  name:"Тамара Салмановна",
  subject:"Добро пожаловать на мой сайт.",
  bio:"Здесь размещается информация о Тамаре Салмановне, её профессиональном опыте, интересах и достижениях.",
  about:"Добро пожаловать! Здесь можно разместить подробную информацию о преподавателе, образовании, опыте работы и достижениях.",
  contacts:"Здесь можно указать электронную почту, телефон и другую контактную информацию.",
  photo:"",
  schedule:[
   {day:"Понедельник",time:"09:00",subject:"Урок",className:"—",room:"—"},
   {day:"Вторник",time:"10:00",subject:"Урок",className:"—",room:"—"},
   {day:"Среда",time:"09:00",subject:"Урок",className:"—",room:"—"}
  ],
  materials:[
   {title:"Учебные материалы",text:"Добавьте сюда презентации, задания и полезные материалы."},
   {title:"Домашние задания",text:"Информация о домашних заданиях будет размещаться здесь."},
   {title:"Полезные ссылки",text:"Добавьте полезные ресурсы для учеников."}
  ],
  news:[
   {title:"Добро пожаловать!",text:"Сайт учителя готов к работе."},
   {title:"Объявления",text:"Новые объявления можно добавлять через панель учителя."}
  ]
 };
}
function getProfile(){try{return {...defaults(),...JSON.parse(localStorage.getItem(KEY)||"null")}}catch(e){return defaults()}}
function setProfile(p){localStorage.setItem(KEY,JSON.stringify(p))}
function qs(id){return document.getElementById(id)}

function applyProfile(){
 const p=getProfile();
 qs("mainName").textContent=p.name;qs("mainSubject").textContent=p.subject;qs("mainBio").textContent=p.bio;
 qs("aboutText").textContent=p.about;qs("contactsText").textContent=p.contacts;qs("year").textContent=new Date().getFullYear();
 qs("mainPhoto").innerHTML=p.photo?'<img class="photo" src="'+p.photo+'" alt="Фото учителя">':'<div class="photo" style="display:flex;align-items:center;justify-content:center">Фото учителя</div>';
 qs("scheduleBody").innerHTML=(p.schedule||[]).map(x=>`<tr><td>${esc(x.day)}</td><td>${esc(x.time)}</td><td>${esc(x.subject)}</td><td>${esc(x.className)}</td><td>${esc(x.room)}</td></tr>`).join("");
 qs("materialsGrid").innerHTML=(p.materials||[]).map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("");
 qs("newsGrid").innerHTML=(p.news||[]).map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toggleMenu(){qs("nav").classList.toggle("open")}
function openLogin(){qs("loginModal").classList.remove("hidden");qs("login").focus()}
function closeLogin(){qs("loginModal").classList.add("hidden");qs("login").value="";qs("password").value="";qs("loginError").textContent=""}
function login(){if(qs("login").value.trim()===CREDENTIALS.login&&qs("password").value===CREDENTIALS.password){closeLogin();openAdmin()}else qs("loginError").textContent="Неверный логин или пароль."}
function closeAdmin(){qs("adminModal").classList.add("hidden")}

function openAdmin(){
 const p=getProfile();qs("editName").value=p.name;qs("editSubject").value=p.subject;qs("editBio").value=p.bio;qs("editAbout").value=p.about;qs("editContacts").value=p.contacts;
 qs("photoFile").value="";qs("saveStatus").textContent="";
 qs("photoPreview").innerHTML=p.photo?'<img class="photo" src="'+p.photo+'" alt="Фото" style="margin-top:8px;width:140px;height:170px">':"";
 renderEditors(p);qs("adminModal").classList.remove("hidden");
}
function renderEditors(p){
 qs("scheduleEditor").innerHTML=(p.schedule||[]).map((x,i)=>`<div class="card editor-row" data-i="${i}">
<label>День</label><input data-f="day" value="${esc(x.day)}"><label>Время</label><input data-f="time" value="${esc(x.time)}" type="time">
<label>Предмет</label><input data-f="subject" value="${esc(x.subject)}"><label>Класс</label><input data-f="className" value="${esc(x.className)}">
<label>Кабинет</label><input data-f="room" value="${esc(x.room)}"><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить строку</button></div>`).join("");
 qs("materialsEditor").innerHTML=(p.materials||[]).map((x,i)=>`<div class="card material-row" data-i="${i}"><label>Название</label><input data-f="title" value="${esc(x.title)}"><label>Описание</label><textarea data-f="text">${esc(x.text)}</textarea><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить</button></div>`).join("");
 qs("newsEditor").innerHTML=(p.news||[]).map((x,i)=>`<div class="card news-row" data-i="${i}"><label>Заголовок</label><input data-f="title" value="${esc(x.title)}"><label>Текст</label><textarea data-f="text">${esc(x.text)}</textarea><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить</button></div>`).join("");
}
function addSchedule(){const d=qs("scheduleEditor");const e=document.createElement("div");e.className="card editor-row";e.innerHTML='<label>День</label><input data-f="day" value="Понедельник"><label>Время</label><input data-f="time" type="time" value="09:00"><label>Предмет</label><input data-f="subject" value=""><label>Класс</label><input data-f="className" value=""><label>Кабинет</label><input data-f="room" value=""><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить строку</button>';d.appendChild(e)}
function addMaterial(){const d=qs("materialsEditor");const e=document.createElement("div");e.className="card material-row";e.innerHTML='<label>Название</label><input data-f="title"><label>Описание</label><textarea data-f="text"></textarea><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить</button>';d.appendChild(e)}
function addNews(){const d=qs("newsEditor");const e=document.createElement("div");e.className="card news-row";e.innerHTML='<label>Заголовок</label><input data-f="title"><label>Текст</label><textarea data-f="text"></textarea><button class="btn btn-outline" onclick="this.parentElement.remove()">Удалить</button>';d.appendChild(e)}
function readRows(sel){return [...document.querySelectorAll(sel)].map(r=>{let o={};r.querySelectorAll("[data-f]").forEach(x=>o[x.dataset.f]=x.value.trim());return o})}
function previewPhoto(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>qs("photoPreview").innerHTML='<img class="photo" src="'+r.result+'" alt="Фото" style="margin-top:8px;width:140px;height:170px">';r.readAsDataURL(f)}
function saveProfile(){
 const old=getProfile();const img=qs("photoPreview").querySelector("img");
 const p={name:qs("editName").value.trim()||"Тамара Салмановна",subject:qs("editSubject").value.trim(),bio:qs("editBio").value.trim(),about:qs("editAbout").value.trim(),contacts:qs("editContacts").value.trim(),photo:img?img.src:old.photo,schedule:readRows("#scheduleEditor .editor-row"),materials:readRows("#materialsEditor .material-row"),news:readRows("#newsEditor .news-row")};
 try{setProfile(p);applyProfile();qs("saveStatus").textContent="✓ Всё сохранено. Теперь изменения видны на телефоне и компьютере в этом браузере."}
 catch(e){qs("saveStatus").textContent="Не удалось сохранить. Если проблема из-за фото — выберите фото меньшего размера."}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeLogin();closeAdmin()}});
applyProfile();
</script>
</body>
</html>
